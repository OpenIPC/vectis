#
# build.yml — CI for vectis: build vectis, vectis-ch34x and vectis-bootrom
# for Linux targets through the Makefile (any compiler warning fails the
# job) and run the regression tests on x86_64.
#

name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

# The build only reads the repository and uploads artifacts.
permissions:
  contents: read

# A newer push to the same branch or PR cancels the run still in progress.
concurrency:
  group: build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux ${{ matrix.platform.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: x86_64
            cross: ""
            pkgs: ""
          - name: arm
            cross: arm-linux-gnueabi-
            pkgs: gcc-arm-linux-gnueabi
          - name: aarch64
            cross: aarch64-linux-gnu-
            pkgs: gcc-aarch64-linux-gnu
          - name: mipsel
            cross: mipsel-linux-gnu-
            pkgs: gcc-mipsel-linux-gnu

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install cross-compiler
        if: matrix.platform.pkgs != ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ${{ matrix.platform.pkgs }}

      - name: Build
        shell: bash
        run: |
          make clean
          make CC=${{ matrix.platform.cross }}gcc STRIP=${{ matrix.platform.cross }}strip \
               all vectis-bootrom 2>&1 | tee build.log
          if grep -q 'warning:' build.log; then
            echo "::error::compiler warnings, see the build log"
            exit 1
          fi
          file vectis vectis-ch34x vectis-bootrom
          ls -l vectis vectis-ch34x vectis-bootrom

      - name: Smoke test
        if: matrix.platform.name == 'x86_64'
        run: |
          ./vectis --version
          ./vectis-ch34x --version
          ./vectis-bootrom --version

      - name: Regression tests
        if: matrix.platform.name == 'x86_64'
        run: python3 tests/test_vectis.py .

      - name: Upload binaries
        uses: actions/upload-artifact@v5
        with:
          name: vectis-${{ matrix.platform.name }}
          path: |
            vectis
            vectis-ch34x
            vectis-bootrom
          if-no-files-found: error
