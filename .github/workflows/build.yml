#
# build.yml — CI for vectis: build vectis (with -U) and vectis-bootrom
# for Linux targets through the Makefile (any compiler warning fails the
# job), check that `make USB=0`, `make WEBTERM=0` and `make FONTS=0` still build, that
# webterm_assets.h matches web/xterm/, and run the regression tests on
# x86_64; plus the static musl builds the release ships: x86_64
# (ci/build-static.sh) and soft-float mipsel for OpenWrt routers
# (ci/build-mipsel.sh); and the Android app (android/): a debug APK with its
# unit tests and lint on every run, the release APK signed with the
# project's key on master.
# On pull requests, version.yml runs .github/check-version.sh: a change to
# the code or the build (this workflow included) comes with a new
# PROGRAM_VERSION and its CHANGELOG.md section; the no-release label lets
# a change that keeps the release files as they are through without one.
# Only the head of master publishes, so a re-run of an older run never
# rolls "latest" back.
# Release: one release only, "latest", updated in place by every push to
# master once all builds pass, never deleted. Its title carries PROGRAM_VERSION ("Vectis 1.8.0"),
# its notes are short; the history is in CHANGELOG.md. No versioned
# releases or v* tags are kept. A new version (not every rebuild) is
# announced in the OpenIPC Telegram dev channel.
#

name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

# The build only reads the repository and uploads artifacts.
permissions:
  contents: read

# A newer push to the same branch or PR cancels the run still in progress;
# on master it waits instead, so a release job is never stopped between
# deleting the old "latest" and creating the new one.
concurrency:
  group: build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  # The version check of pull requests runs in version.yml: a label change
  # re-runs only that check, not the builds.

  linux:
    name: Linux ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.runner || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          # run: how the smoke test starts a binary (qemu-user for the
          # cross builds, with the toolchain's libc as the sysroot)
          # runner: only where ubuntu-latest will not do
          - name: x86_64
            cross: ""
            pkgs: ""
            run: ""
          - name: arm
            cross: arm-linux-gnueabi-
            pkgs: gcc-arm-linux-gnueabi qemu-user
            run: qemu-arm -L /usr/arm-linux-gnueabi
          - name: aarch64
            cross: aarch64-linux-gnu-
            pkgs: gcc-aarch64-linux-gnu qemu-user
            run: qemu-aarch64 -L /usr/aarch64-linux-gnu
          # Ubuntu 26.04 has no gcc-mipsel-linux-gnu (#69)
          - name: mipsel
            runner: ubuntu-24.04
            cross: mipsel-linux-gnu-
            pkgs: gcc-mipsel-linux-gnu qemu-user
            run: qemu-mipsel -L /usr/mipsel-linux-gnu

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # The runners' Ubuntu mirror is sometimes slow (160 kB/s for the
      # 44 MB of these packages), so the .deb files are cached: one week per
      # key, and a new week starts from the last one, so apt fetches only
      # what changed. A stalled mirror still fails the step quickly instead
      # of holding it (#71); a connection that stops sending is dropped
      # after 30 s and retried.
      - name: Week of the apt cache
        if: matrix.platform.pkgs != ''
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Cache apt packages
        if: matrix.platform.pkgs != ''
        uses: actions/cache@v6
        with:
          path: .apt-archives
          key: apt-${{ matrix.platform.runner || 'ubuntu-latest' }}-${{ matrix.platform.name }}-${{ steps.week.outputs.week }}
          restore-keys: apt-${{ matrix.platform.runner || 'ubuntu-latest' }}-${{ matrix.platform.name }}-

      - name: Install cross-compiler
        if: matrix.platform.pkgs != ''
        timeout-minutes: 5
        run: |
          mkdir -p .apt-archives/partial
          apt="sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::Retries=3 -o Dir::Cache::Archives=$PWD/.apt-archives"
          $apt update
          $apt install -y ${{ matrix.platform.pkgs }}
          $apt autoclean
          sudo rm -rf .apt-archives/partial .apt-archives/lock

      - name: Build
        shell: bash
        run: |
          make clean
          make CC=${{ matrix.platform.cross }}gcc STRIP=${{ matrix.platform.cross }}strip \
               all vectis-bootrom 2>&1 | tee build.log
          if grep -q 'warning:' build.log; then
            echo "::error::compiler warnings, see the build log"
            exit 1
          fi
          file vectis vectis-bootrom
          ls -l vectis vectis-bootrom

      - name: Smoke test
        run: |
          ${{ matrix.platform.run }} ./vectis --version
          ${{ matrix.platform.run }} ./vectis-bootrom --version

      - name: Regression tests
        if: matrix.platform.name == 'x86_64'
        run: python3 tests/test_vectis.py .

      - name: Upload binaries
        uses: actions/upload-artifact@v5
        with:
          name: vectis-${{ matrix.platform.name }}
          path: |
            vectis
            vectis-bootrom
          if-no-files-found: error

      # make USB=0 stays a build option: vectis without -U
      - name: Build without USB (USB=0)
        shell: bash
        run: |
          make clean
          make CC=${{ matrix.platform.cross }}gcc STRIP=${{ matrix.platform.cross }}strip \
               USB=0 2>&1 | tee build.log
          if grep -q 'warning:' build.log; then
            echo "::error::compiler warnings, see the build log"
            exit 1
          fi
          ${{ matrix.platform.run }} ./vectis --version

      - name: Regression tests without USB (USB=0)
        if: matrix.platform.name == 'x86_64'
        run: python3 tests/test_vectis.py .

      # make WEBTERM=0 stays a build option: vectis without the web terminal
      - name: Build without the web terminal (WEBTERM=0)
        shell: bash
        run: |
          make clean
          make CC=${{ matrix.platform.cross }}gcc STRIP=${{ matrix.platform.cross }}strip \
               WEBTERM=0 2>&1 | tee build.log
          if grep -q 'warning:' build.log; then
            echo "::error::compiler warnings, see the build log"
            exit 1
          fi
          ${{ matrix.platform.run }} ./vectis --version

      - name: Regression tests without the web terminal (WEBTERM=0)
        if: matrix.platform.name == 'x86_64'
        run: python3 tests/test_vectis.py .

      # make FONTS=0 stays a build option: vectis without the page's brass fonts
      - name: Build without the brass fonts (FONTS=0)
        shell: bash
        run: |
          make clean
          make CC=${{ matrix.platform.cross }}gcc STRIP=${{ matrix.platform.cross }}strip \
               FONTS=0 2>&1 | tee build.log
          if grep -q 'warning:' build.log; then
            echo "::error::compiler warnings, see the build log"
            exit 1
          fi
          ${{ matrix.platform.run }} ./vectis --version

      - name: Regression tests without the brass fonts (FONTS=0)
        if: matrix.platform.name == 'x86_64'
        run: python3 tests/test_vectis.py .

      # webterm_assets.h is made from web/xterm/ by web/gen-assets.sh and
      # committed, so every build (make, the NDK, a plain cc) has it.
      - name: webterm_assets.h matches web/xterm/
        if: matrix.platform.name == 'x86_64'
        run: |
          sh web/gen-assets.sh
          if ! git diff --quiet -- webterm_assets.h; then
            echo "::error::webterm_assets.h is out of date: run sh web/gen-assets.sh and commit it"
            exit 1
          fi

  static:
    name: Linux x86_64 static (musl)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build and test in alpine:3.22
        run: |
          docker run --rm -v "$PWD":/src -w /src alpine:3.22 \
            sh ci/build-static.sh dist x86_64

      - name: Upload binaries
        uses: actions/upload-artifact@v5
        with:
          name: vectis-x86_64-static
          path: dist/*
          if-no-files-found: error

  mipsel:
    name: Linux mipsel static (musl, soft-float)
    runs-on: ubuntu-latest
    env:
      TOOLCHAIN_CACHE: ${{ github.workspace }}/.toolchains
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # The apt cache works as in the linux job above.
      - name: Week of the apt cache
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Cache apt packages
        uses: actions/cache@v6
        with:
          path: .apt-archives
          key: apt-ubuntu-latest-qemu-user-${{ steps.week.outputs.week }}
          restore-keys: apt-ubuntu-latest-qemu-user-

      - name: Install qemu-user
        timeout-minutes: 5
        run: |
          mkdir -p .apt-archives/partial
          apt="sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::Retries=3 -o Dir::Cache::Archives=$PWD/.apt-archives"
          $apt update
          $apt install -y qemu-user
          $apt autoclean
          sudo rm -rf .apt-archives/partial .apt-archives/lock

      - name: Cache toolchain
        uses: actions/cache@v6
        with:
          path: .toolchains
          key: toolchain-mipsel-${{ hashFiles('ci/build-mipsel.sh') }}

      - name: Build
        run: ci/build-mipsel.sh dist

      - name: Upload binaries
        uses: actions/upload-artifact@v5
        with:
          name: vectis-mipsel-static
          path: dist/*
          if-no-files-found: error

  # The Android app (android/): NDK build of vectis (android/build-native.sh),
  # unit tests, lint without warnings, a debug APK (the fixed debug key of the
  # repository). The release APK is the android-release job, on master only.
  android:
    name: Android app (APK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true   # bundles/camex: the camex tunnel library of the app

      - name: Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: NDK r27c
        run: |
          # yes ends with SIGPIPE when sdkmanager is done: not a failure (pipefail)
          (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Build, test and lint
        run: |
          cd android
          gradle --no-daemon assembleDebug testDebugUnitTest lintDebug
          sh test-abis.sh               # -PvectisAbis: bad lists stop the build (#91)
          cp app/build/outputs/apk/debug/app-debug.apk vectis-android-debug.apk

      - name: Upload the debug APK
        uses: actions/upload-artifact@v5
        with:
          name: vectis-android-debug
          path: android/vectis-android-debug.apk
          if-no-files-found: error

  # The release APK, signed with the project's release key (repository
  # secrets). Only pushes to master reach it; a fork has no key and
  # publishes the Linux binaries alone. The signer has to be the project's
  # certificate, or users could not update the app.
  android-release:
    name: Android app (release APK)
    needs: android
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.build.outputs.signed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true   # bundles/camex: the camex tunnel library of the app

      - name: Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: NDK r27c
        run: |
          # yes ends with SIGPIPE when sdkmanager is done: not a failure (pipefail)
          (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Build and sign
        id: build
        env:
          KEYSTORE_BASE64: ${{ secrets.VECTIS_KEYSTORE_BASE64 }}
          VECTIS_KEYSTORE_PASSWORD: ${{ secrets.VECTIS_KEYSTORE_PASSWORD }}
          VECTIS_KEY_ALIAS: ${{ secrets.VECTIS_KEY_ALIAS }}
          VECTIS_KEY_PASSWORD: ${{ secrets.VECTIS_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::notice::no release key here (a fork): no release APK"
            echo "signed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # the key leaves the runner's disk however the step ends
          trap 'rm -rf "$RUNNER_TEMP/keys"' EXIT
          mkdir -p "$RUNNER_TEMP/keys"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keys/vectis-release.jks"
          export VECTIS_KEYSTORE_FILE="$RUNNER_TEMP/keys/vectis-release.jks"
          (cd android && gradle --no-daemon assembleRelease)
          cp android/app/build/outputs/apk/release/app-release.apk vectis-android.apk
          ci/check-apk.sh vectis-android.apk
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Upload the release APK
        if: steps.build.outputs.signed == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: vectis-android-release
          path: vectis-android.apk
          if-no-files-found: error

  # The one release, "latest": updated from every push to master after all
  # builds pass, from the static binaries built and tested above and the
  # signed APK. A failure at any step leaves a release that a re-run of this
  # job finishes (#73).
  release:
    name: Publish "latest"
    needs: [linux, static, mipsel, android, android-release]
    # All of them must pass (and a cancelled run stops here). android-release
    # passes without a key too (a fork): then the Linux binaries alone.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # update the release and its tag
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download
        uses: actions/download-artifact@v5
        with:
          pattern: vectis-*-static
          path: artifacts

      - name: Download the Android app
        if: needs.android-release.outputs.signed == 'true'
        uses: actions/download-artifact@v5
        with:
          name: vectis-android-release
          path: artifacts/android

      - name: Check the files
        env:
          SIGNED: ${{ needs.android-release.outputs.signed }}
        run: |
          ver=$(sed -n 's/^#define PROGRAM_VERSION *"\(.*\)"/\1/p' vectis.c)
          [ -n "$ver" ] || { echo "::error::no PROGRAM_VERSION in vectis.c"; exit 1; }
          # each build's own checksums (between the CI jobs; not published)
          mkdir dist
          for a in vectis-x86_64-static vectis-mipsel-static; do
            (cd "artifacts/$a" && sha256sum -c SHA256SUMS)
            cp artifacts/$a/vectis-linux-* dist/
          done
          ls -l dist
          file dist/vectis-linux-mipsel | grep -q 'MIPS.*statically linked' ||
            { echo "::error::vectis-linux-mipsel is not a static MIPS binary"; exit 1; }
          if [ "$SIGNED" = true ]; then
            cp artifacts/android/vectis-android.apk dist/
            ci/check-apk.sh dist/vectis-android.apk "$ver"
          fi
          ls -l dist
          chmod 755 dist/vectis-linux-x86_64
          # first line: "<argv[0]> <version>"
          got=$(dist/vectis-linux-x86_64 --version | head -1 | awk '{print $NF}')
          echo "binary says $got, vectis.c says $ver"
          [ "$got" = "$ver" ] || { echo "::error::the binary is $got, not $ver"; exit 1; }
          echo "VER=$ver" >> "$GITHUB_ENV"

      - name: Publish
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only the head of master publishes: a re-run of an older run must not
          # roll "latest" back to its commit. Checked here, right before the
          # release is touched; a newer push's run waits for this one (concurrency)
          # and publishes after it. A failed lookup fails the job, not skips it.
          if ! head=$(git ls-remote --exit-code origin refs/heads/master); then
            echo "::error::cannot read the head of master"; exit 1
          fi
          head=${head%%[[:space:]]*}
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::notice::master is at ${head:0:7} now, not ${GITHUB_SHA::7}: not published"
            exit 0
          fi
          # The release being updated: its title tells Telegram whether this
          # is a new version. The title changes last, so after a failure a
          # re-run still sees the old one and still announces; a draft is a
          # first publication that failed, so it counts as no title. "Not
          # found" means there is no release yet; any other failure stops
          # here, before anything is changed or announced.
          if prev=$(gh release view latest --json name,isDraft \
                    -q 'if .isDraft then "" else .name end' 2>err.txt); then
            exists=1
          elif grep -qi 'not found' err.txt; then
            exists=0 prev=""
          else
            cat err.txt; echo "::error::cannot read the current \"latest\" release"; exit 1
          fi
          echo "previous release: ${prev:-none}"
          [ "$prev" = "Vectis ${VER}" ] || echo "new=true" >> "$GITHUB_OUTPUT"

          # The app only when its signed APK is here (a fork has no key)
          if [ -f dist/vectis-android.apk ]; then
            APK_TITLE=", and the Android app"
            APK_LINE='- `vectis-android.apk` — the Android app (5.0 and later, 32- and 64-bit ARM): vectis on a TV box or phone with a USB host, without root'
          else
            APK_TITLE="" APK_LINE=""
          fi
          cat > notes.md <<NOTES
          Vectis ${VER} (${GITHUB_SHA::7}): static Linux binaries (musl), no dependencies${APK_TITLE}.

          - \`vectis-linux-x86_64\` — serial console, RFC 2217 client/server, web power console (\`-u\`, \`-h/-p\`, \`-l\`, \`-w\`) and \`-U\`: CH340/CH341 adapters driven through usbfs on hosts without a kernel driver
          - \`vectis-linux-mipsel\` — the same for MIPS little-endian routers (MediaTek MT7620/MT7621/MT7628, OpenWrt): soft-float, runs with or without an FPU
          ${APK_LINE}

          Changes: [CHANGELOG.md](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/master/CHANGELOG.md); usage: [README](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}#readme).
          NOTES
          if [ "$exists" = 1 ]; then
            # In place, the title last: the release stays. A file is away only
            # while it is replaced; a failure there lasts until a re-run.
            gh release upload latest dist/* --clobber
            # no signed APK this time: an older one must not stay downloadable
            # (a failed lookup fails the step rather than leave it in doubt)
            if [ ! -f dist/vectis-android.apk ]; then
              assets=$(gh release view latest --json assets -q '.assets[].name') ||
                { echo "::error::cannot list the assets of \"latest\""; exit 1; }
              if printf '%s\n' "$assets" | grep -qx vectis-android.apk; then
                gh release delete-asset latest vectis-android.apk -y
              fi
            fi
            # A draft has no tag until it is published.
            if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/latest" >/dev/null 2>err.txt; then
              gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/latest" \
                -f sha="$GITHUB_SHA" -F force=true >/dev/null
            elif grep -qi 'not found' err.txt; then
              gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
                -f ref=refs/tags/latest -f sha="$GITHUB_SHA" >/dev/null
            else
              cat err.txt; echo "::error::cannot read the \"latest\" tag"; exit 1
            fi
            gh release edit latest \
              --draft=false \
              --latest \
              --title "Vectis ${VER}" \
              --target "${GITHUB_SHA}" \
              --notes-file notes.md
          else
            # Only before the first publication.
            gh release create latest dist/* \
              --latest \
              --title "Vectis ${VER}" \
              --target "${GITHUB_SHA}" \
              --notes-file notes.md
          fi

      # The binaries of a new version go to the OpenIPC Telegram dev channel as files, for the
      # archive and test downloads: one post (sendMediaGroup), a short caption, no text from
      # CHANGELOG.md (#58). Organization secrets; a failed upload is a warning, not a failed release.
      - name: Telegram
        if: steps.publish.outputs.new == 'true'
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN_BOT_OPENIPC }}
          TG_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL_OPENIPC_DEV }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHANNEL" ]; then
            echo "::warning::Telegram secrets are not available, binaries not posted"; exit 0
          fi
          for_what="Linux"
          [ -f dist/vectis-android.apk ] && for_what="Linux and Android"
          caption=$(printf 'Vectis %s for %s\nCommit: %s\nTime: %s\n\n%s' "$VER" "$for_what" "${GITHUB_SHA::7}" \
            "$(date -u '+%Y-%m-%d %H:%M:%S UTC')" "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/latest")
          files=(dist/vectis-linux-* dist/vectis-android.apk)
          [ -f dist/vectis-android.apk ] || files=(dist/vectis-linux-*)
          media='[]' form=()
          for i in "${!files[@]}"; do
            item=$(jq -cn --arg m "attach://f$i" '{type: "document", media: $m}')
            [ "$i" -eq $(( ${#files[@]} - 1 )) ] && item=$(jq -c --arg c "$caption" '. + {caption: $c}' <<< "$item")
            media=$(jq -c --argjson it "$item" '. + [$it]' <<< "$media")
            form+=(-F "f$i=@${files[$i]}")
          done
          HTTP=$(curl -sS -o tg.json -w '%{http_code}' "https://api.telegram.org/bot${TG_TOKEN}/sendMediaGroup" \
            -F chat_id="$TG_CHANNEL" -F media="$media" "${form[@]}") || HTTP=000
          echo "Telegram response: $HTTP"
          [ "$HTTP" = 200 ] || echo "::warning::Telegram upload failed (HTTP $HTTP): $(cat tg.json 2>/dev/null)"
