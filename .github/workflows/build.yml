#
# build.yml — CI for vectis: build vectis (with -U) and vectis-bootrom
# for Linux targets through the Makefile (any compiler warning fails the
# job), check that `make USB=0` still builds, and run the regression tests
# on x86_64; plus the static musl builds the release ships: x86_64
# (ci/build-static.sh) and soft-float mipsel for OpenWrt routers
# (ci/build-mipsel.sh).
# On pull requests, .github/check-version.sh checks that a change to the
# code or the build (this workflow included) comes with a new
# PROGRAM_VERSION and its CHANGELOG.md section; the no-release label lets
# a change that keeps the release files as they are through without one.
# Only the head of master publishes, so a re-run of an older run never
# rolls "latest" back.
# Release: one release only, "latest", replaced by every push to master
# once all builds pass. Its title carries PROGRAM_VERSION ("Vectis 1.8.0"),
# its notes are short; the history is in CHANGELOG.md. No versioned
# releases or v* tags are kept. A new version (not every rebuild) is
# announced in the OpenIPC Telegram dev channel.
#

name: Build

on:
  push:
  pull_request:
    # labeled / unlabeled: the version check reads the no-release label
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

# The build only reads the repository and uploads artifacts.
permissions:
  contents: read

# A newer push to the same branch or PR cancels the run still in progress;
# on master it waits instead, so a release job is never stopped between
# deleting the old "latest" and creating the new one.
concurrency:
  group: build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  version:
    name: Version bump
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # The checkout is the merge commit; its first parent is the base it was made from.
      - name: Code changes come with a new version
        env:
          # a change that leaves the release files as they are may skip the new version
          NO_RELEASE: ${{ contains(github.event.pull_request.labels.*.name, 'no-release') }}
        run: .github/check-version.sh HEAD^1

  linux:
    name: Linux ${{ matrix.platform.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          # run: how the smoke test starts a binary (qemu-user for the
          # cross builds, with the toolchain's libc as the sysroot)
          - name: x86_64
            cross: ""
            pkgs: ""
            run: ""
          - name: arm
            cross: arm-linux-gnueabi-
            pkgs: gcc-arm-linux-gnueabi qemu-user
            run: qemu-arm -L /usr/arm-linux-gnueabi
          - name: aarch64
            cross: aarch64-linux-gnu-
            pkgs: gcc-aarch64-linux-gnu qemu-user
            run: qemu-aarch64 -L /usr/aarch64-linux-gnu
          - name: mipsel
            cross: mipsel-linux-gnu-
            pkgs: gcc-mipsel-linux-gnu qemu-user
            run: qemu-mipsel -L /usr/mipsel-linux-gnu

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install cross-compiler
        if: matrix.platform.pkgs != ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ${{ matrix.platform.pkgs }}

      - name: Build
        shell: bash
        run: |
          make clean
          make CC=${{ matrix.platform.cross }}gcc STRIP=${{ matrix.platform.cross }}strip \
               all vectis-bootrom 2>&1 | tee build.log
          if grep -q 'warning:' build.log; then
            echo "::error::compiler warnings, see the build log"
            exit 1
          fi
          file vectis vectis-bootrom
          ls -l vectis vectis-bootrom

      - name: Smoke test
        run: |
          ${{ matrix.platform.run }} ./vectis --version
          ${{ matrix.platform.run }} ./vectis-bootrom --version

      - name: Regression tests
        if: matrix.platform.name == 'x86_64'
        run: python3 tests/test_vectis.py .

      - name: Upload binaries
        uses: actions/upload-artifact@v5
        with:
          name: vectis-${{ matrix.platform.name }}
          path: |
            vectis
            vectis-bootrom
          if-no-files-found: error

      # make USB=0 stays a build option: vectis without -U
      - name: Build without USB (USB=0)
        shell: bash
        run: |
          make clean
          make CC=${{ matrix.platform.cross }}gcc STRIP=${{ matrix.platform.cross }}strip \
               USB=0 2>&1 | tee build.log
          if grep -q 'warning:' build.log; then
            echo "::error::compiler warnings, see the build log"
            exit 1
          fi
          ${{ matrix.platform.run }} ./vectis --version

      - name: Regression tests without USB (USB=0)
        if: matrix.platform.name == 'x86_64'
        run: python3 tests/test_vectis.py .

  static:
    name: Linux x86_64 static (musl)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build and test in alpine:3.22
        run: |
          docker run --rm -v "$PWD":/src -w /src alpine:3.22 \
            sh ci/build-static.sh dist x86_64

      - name: Upload binaries
        uses: actions/upload-artifact@v5
        with:
          name: vectis-x86_64-static
          path: dist/*
          if-no-files-found: error

  mipsel:
    name: Linux mipsel static (musl, soft-float)
    runs-on: ubuntu-latest
    env:
      TOOLCHAIN_CACHE: ${{ github.workspace }}/.toolchains
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install qemu-user
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user

      - name: Cache toolchain
        uses: actions/cache@v6
        with:
          path: .toolchains
          key: toolchain-mipsel-${{ hashFiles('ci/build-mipsel.sh') }}

      - name: Build
        run: ci/build-mipsel.sh dist

      - name: Upload binaries
        uses: actions/upload-artifact@v5
        with:
          name: vectis-mipsel-static
          path: dist/*
          if-no-files-found: error

  # The one release, "latest": rebuilt from every push to master after all
  # builds pass, from the static binaries built and tested above.
  release:
    name: Publish "latest"
    needs: [linux, static, mipsel]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # replace the release
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download
        uses: actions/download-artifact@v5
        with:
          pattern: vectis-*-static
          path: artifacts

      - name: Check the files
        run: |
          ver=$(sed -n 's/^#define PROGRAM_VERSION *"\(.*\)"/\1/p' vectis.c)
          [ -n "$ver" ] || { echo "::error::no PROGRAM_VERSION in vectis.c"; exit 1; }
          # each build's own checksums (between the CI jobs; not published)
          mkdir dist
          for a in vectis-x86_64-static vectis-mipsel-static; do
            (cd "artifacts/$a" && sha256sum -c SHA256SUMS)
            cp artifacts/$a/vectis-linux-* dist/
          done
          ls -l dist
          file dist/vectis-linux-mipsel | grep -q 'MIPS.*statically linked' ||
            { echo "::error::vectis-linux-mipsel is not a static MIPS binary"; exit 1; }
          chmod 755 dist/vectis-linux-x86_64
          # first line: "<argv[0]> <version>"
          got=$(dist/vectis-linux-x86_64 --version | head -1 | awk '{print $NF}')
          echo "binary says $got, vectis.c says $ver"
          [ "$got" = "$ver" ] || { echo "::error::the binary is $got, not $ver"; exit 1; }
          echo "VER=$ver" >> "$GITHUB_ENV"

      # Only the head of master publishes: a re-run of an older run (or one that
      # finishes after a newer push) must not roll "latest" back to its commit.
      - name: Branch head
        id: head
        run: |
          head=$(git ls-remote origin refs/heads/master | cut -f 1)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::notice::master is at ${head:0:7} now, not ${GITHUB_SHA::7}: not published"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        id: publish
        if: steps.head.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The release being replaced: its title tells Telegram whether this
          # is a new version. "Not found" means there is none yet; any other
          # failure stops here, before anything is deleted or announced.
          if prev=$(gh release view latest --json name -q .name 2>err.txt); then
            exists=1
          elif grep -qi 'not found' err.txt; then
            exists=0 prev=""
          else
            cat err.txt; echo "::error::cannot read the current \"latest\" release"; exit 1
          fi
          echo "previous release: ${prev:-none}"
          [ "$prev" = "Vectis ${VER}" ] || echo "new=true" >> "$GITHUB_OUTPUT"

          cat > notes.md <<NOTES
          Vectis ${VER} (${GITHUB_SHA::7}): static Linux binaries (musl), no dependencies.

          - \`vectis-linux-x86_64\` — serial console, RFC 2217 client/server, web power console (\`-u\`, \`-h/-p\`, \`-l\`, \`-w\`) and \`-U\`: CH340/CH341 adapters driven through usbfs on hosts without a kernel driver
          - \`vectis-linux-mipsel\` — the same for MIPS little-endian routers (MediaTek MT7620/MT7621/MT7628, OpenWrt): soft-float, runs with or without an FPU

          Changes: [CHANGELOG.md](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/master/CHANGELOG.md); usage: [README](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}#readme).
          NOTES
          # "latest" is missing only before the first publication
          if [ "$exists" = 1 ]; then
            gh release delete latest --cleanup-tag --yes
          fi
          gh release create latest dist/* \
            --latest \
            --title "Vectis ${VER}" \
            --target "${GITHUB_SHA}" \
            --notes-file notes.md

      # The binaries of a new version go to the OpenIPC Telegram dev channel as files, for the
      # archive and test downloads: one post (sendMediaGroup), a short caption, no text from
      # CHANGELOG.md (#58). Organization secrets; a failed upload is a warning, not a failed release.
      - name: Telegram
        if: steps.publish.outputs.new == 'true'
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN_BOT_OPENIPC }}
          TG_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL_OPENIPC_DEV }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHANNEL" ]; then
            echo "::warning::Telegram secrets are not available, binaries not posted"; exit 0
          fi
          caption=$(printf 'Vectis %s for Linux\nCommit: %s\nTime: %s\n\n%s' "$VER" "${GITHUB_SHA::7}" \
            "$(date -u '+%Y-%m-%d %H:%M:%S UTC')" "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/latest")
          files=(dist/vectis-linux-*)
          media='[]' form=()
          for i in "${!files[@]}"; do
            item=$(jq -cn --arg m "attach://f$i" '{type: "document", media: $m}')
            [ "$i" -eq $(( ${#files[@]} - 1 )) ] && item=$(jq -c --arg c "$caption" '. + {caption: $c}' <<< "$item")
            media=$(jq -c --argjson it "$item" '. + [$it]' <<< "$media")
            form+=(-F "f$i=@${files[$i]}")
          done
          HTTP=$(curl -sS -o tg.json -w '%{http_code}' "https://api.telegram.org/bot${TG_TOKEN}/sendMediaGroup" \
            -F chat_id="$TG_CHANNEL" -F media="$media" "${form[@]}") || HTTP=000
          echo "Telegram response: $HTTP"
          [ "$HTTP" = 200 ] || echo "::warning::Telegram upload failed (HTTP $HTTP): $(cat tg.json 2>/dev/null)"
