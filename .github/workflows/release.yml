#
# release.yml — publish a GitHub Release for a version tag (v1.7.0):
# static musl builds of vectis and vectis-ch34x (ci/build-static.sh),
# tested, with SHA256SUMS.  The tag must match PROGRAM_VERSION in vectis.c.
# Platforms so far: x86_64.
#

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: Build x86_64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Tag matches the program version
        run: |
          ver=$(sed -n 's/^#define PROGRAM_VERSION *"\(.*\)"/\1/p' vectis.c)
          if [ "v$ver" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match PROGRAM_VERSION $ver"
            exit 1
          fi
          echo "VERSION=$ver" >> "$GITHUB_ENV"

      - name: Build and test in alpine:3.22
        run: |
          docker run --rm -v "$PWD":/src -w /src alpine:3.22 \
            sh ci/build-static.sh dist "$VERSION" x86_64

      - name: Upload
        uses: actions/upload-artifact@v5
        with:
          name: release-x86_64
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the release
    steps:
      - name: Download
        uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver=${GITHUB_REF_NAME#v}
          (cd dist && sha256sum -c SHA256SUMS)
          cat > notes.md <<NOTES
          Static Linux binaries (musl), no dependencies:

          - \`vectis-$ver-linux-x86_64\` — serial console, RFC 2217 client/server, web power console (\`-u\`, \`-h/-p\`, \`-l\`, \`-w\`)
          - \`vectis-ch34x-$ver-linux-x86_64\` — the same plus \`-U\`: CH340/CH341 adapters driven through usbfs on hosts without a kernel driver

          Check: \`sha256sum -c SHA256SUMS\`. Usage and the udev rule for \`-U\`: [README](https://github.com/$GITHUB_REPOSITORY#readme).
          NOTES
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "vectis $ver" --notes-file notes.md --generate-notes --verify-tag
